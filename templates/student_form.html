<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>{{ title }}</h1>

    <form method="POST" class="student-form">
        <label>Name</label>
        <input type="text" name="name" value="{{ student[1] if student else '' }}" required>

        <label>Course</label>
        <input type="text" name="course" value="{{ student[2] if student else 'BCA' }}" required>

        <label>Marks</label>
        <input type="number" name="marks" value="{{ student[3] if student else '' }}" required>

        <label>City</label>
        <input type="text" name="city" value="{{ student[4] if student else '' }}" required>

        <button type="submit">Save</button>
        <a href="/">Back</a>
    </form>
</div>
</body>
</html>
